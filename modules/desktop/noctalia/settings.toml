[shell]
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    default_view = "all"
    fetch_exchange_rates = false

    [shell.panel]
    launcher_placement = "attached"
    launcher_position = "auto"

    [shell.screenshot]
    region_modifier = "super"
    remember_last_region = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/nix/store/5brnkh7ijg7s16c146hp2k2lhkz7p4ir-noctalia-5.4.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/5brnkh7ijg7s16c146hp2k2lhkz7p4ir-noctalia-5.4.0/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
unit = "imperial"

[widget.audio_visualizer]
bands = 100
reversed = true
show_when_idle = true
width = 500

[widget.battery]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
font_scale = 0.85000000000000009
scale = 0.85000000000000009

[widget.control-center]
enabled = false

[widget.launcher]
