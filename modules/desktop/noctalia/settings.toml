config_version = 16

[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.4999999888241291
center = [ "group:g1" ]
end = [
    "weather",
    "clipboard",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "clock",
    "session"
]
margin_ends = 25
padding = 20
start = [ "launcher", "workspaces" ]

    [[bar.default.capsule_group]]
