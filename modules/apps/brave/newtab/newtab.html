<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    /* Same navy as the theme's toolbar, so there's no white flash before the GIF paints. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #14122a;
    }

    /* Fill the tab and crop the edges instead of letterboxing (the GIF is
       16:9, the ultrawide is 21:9). Pixelated keeps the pixel art sharp
       when it's scaled up instead of smearing it. */
    img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img src="cyberpunk-rain.gif" alt="">
</body>
</html>
